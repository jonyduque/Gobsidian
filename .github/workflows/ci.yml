name: ci

on:
  push:
  pull_request:

jobs:
  # A bateria do projeto, no MESMO script que roda na maquina de quem
  # desenvolve. Ate 2026-09-08 o CI reimplementava um subconjunto dela, e
  # mutate.ps1, check_gates.ps1 e audit_reports.ps1 nao rodavam aqui.
  #
  # 1.27.1 e a toolchain com que os binarios publicados sao compilados (ver
  # release.yml). A matriz abaixo continua em 1.25, o piso declarado no go.mod:
  # as duas pontas sao testadas, e um piso que ninguem compila e um piso que ja
  # quebrou.
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      go-version: '1.27.1'

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: gofmt
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then
            echo "[!] arquivos fora do formato:"
            echo "$fmtout"
            exit 1
          fi
      # go vet nativo ja roda na matriz; estes dois cobrem os arquivos atras
      # de build tag que a matriz do runner atual nao compila.
      - name: vet cruzado
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

  netcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: nenhum pacote do produto importa rede
        shell: pwsh
        run: ./scripts/check_net.ps1

  checagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: referencias a codigo em documentos
        shell: pwsh
        run: ./scripts/check_doc_refs.ps1
      - name: ancoras do README resolvidas e secoes alcancaveis
        shell: pwsh
        run: ./scripts/check_readme_anchors.ps1
      - name: parametros de tools declarados e lidos
        shell: pwsh
        run: ./scripts/check_tool_params.ps1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      # v6 fixa golangci-lint v1.64.8, compilado com Go 1.24, e ele se recusa
      # a rodar contra um go.mod que declara 1.25.0 -- que e o nosso, forcado
      # pelo pin do SDK de MCP. Precisa ser v8+, que traz a linha v2, a mesma
      # que .golangci.yml declara em `version: "2"`.
      #
      # A versao e fixada de proposito: com ela flutuando, um lint verde na
      # maquina de quem desenvolve nao diz nada sobre o CI. Foi assim que a
      # primeira rodada real deste workflow reprovou com 0 achados locais.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  lint-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      # golangci-lint so analisa os arquivos que a plataforma do runner
      # compila. Sem este job, parent_windows.go, checks_windows.go e
      # path_windows.go nunca sao lintados — e parent_windows.go e onde
      # vivia o defeito que deixou 5 de 5 orfaos.
      # v6 fixa golangci-lint v1.64.8, compilado com Go 1.24, e ele se recusa
      # a rodar contra um go.mod que declara 1.25.0 -- que e o nosso, forcado
      # pelo pin do SDK de MCP. Precisa ser v8+, que traz a linha v2, a mesma
      # que .golangci.yml declara em `version: "2"`.
      #
      # A versao e fixada de proposito: com ela flutuando, um lint verde na
      # maquina de quem desenvolve nao diz nada sobre o CI. Foi assim que a
      # primeira rodada real deste workflow reprovou com 0 achados locais.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  orphans:
    # Gate de liberacao do M0: zero processos gobsidian.exe orfaos apos
    # encerramento abrupto do host, em 100 ciclos. So faz sentido no Windows
    # — os tres mecanismos de encerramento (stdin EOF via pipe, sinais,
    # vigilia do processo pai) tem sua parte especifica de plataforma
    # exercitada aqui, e o defeito que este gate existe para pegar (parent
    # watch comparando so pid+creation time) e exclusivo de parent_windows.go.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: compilar
        shell: pwsh
        run: ./scripts/build.ps1
      # Um cenario por MECANISMO. Ate 2026-08-02 so existia o primeiro, e as
      # duas ultimas rodadas deram 100/100 em "stdin-eof": a vigilia do pai e o
      # tratamento de sinal nunca tinham sido exercitados ponta a ponta, e a
      # vigilia do pai ja falhou aqui deixando 5 de 5 orfaos. Cada cenario
      # desconecta os outros dois mecanismos e o script reprova se o "reason="
      # registrado nao for o do mecanismo que o cenario nomeia.
      - name: 100 ciclos - stdin fecha (EOF)
        shell: pwsh
        run: ./scripts/test_orphans.ps1 -Cycles 100 -Scenario stdin-eof
      - name: 100 ciclos - pai morre com stdin aberto
        shell: pwsh
        run: ./scripts/test_orphans.ps1 -Cycles 100 -Scenario parent-death
      # O cenario signal depende de CONIN$, o buffer de entrada do console. Se
      # o runner rodar sem console, orphan_signal_host.ps1 sai com mensagem
      # explicita em vez de medir outra coisa. Foi acrescentado aqui para o CI
      # responder se ele roda neste ambiente — a resposta esta em
      # .superpowers/sdd/task-76-report.md.
      - name: 100 ciclos - sinal, com stdin aberto e pai vivo
        shell: pwsh
        run: ./scripts/test_orphans.ps1 -Cycles 100 -Scenario signal
      - name: 100 ciclos - daemon ocioso
        shell: pwsh
        run: ./scripts/test_orphans.ps1 -Cycles 100 -Scenario daemon-idle

  instalador:
    # As 1 738 linhas de instalador que este job substitui tinham ZERO cobertura
    # de CI -- e sao o codigo que encerra processos do usuario e reescreve a
    # configuracao de hosts que ele editou a mao.
    #
    # O teste instala num diretorio TEMPORARIO, com --hosts none e --no-path:
    # um runner de CI nao tem host de IA para configurar, e mexer no PATH dele
    # nao prova nada. O que se prova aqui e que o binario se instala de verdade,
    # nas tres plataformas, e escreve o manifesto que `update` depois le.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: compilar
        run: go build -o bin/gobsidian ./cmd/gobsidian

      - name: instalar num diretorio temporario
        shell: bash
        run: |
          set -eu
          DESTINO="$(mktemp -d)/gobsidian"
          COFRE="$(mktemp -d)"
          ./bin/gobsidian install --install-dir "$DESTINO" --vault "$COFRE" --hosts none --no-path --yes
          echo "DESTINO=$DESTINO" >> "$GITHUB_ENV"

      - name: o binario esta la e responde
        shell: bash
        run: |
          set -eu
          EXE="$DESTINO/gobsidian"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXE="$DESTINO/gobsidian.exe"; fi
          test -x "$EXE" || { echo "[!] binario nao foi instalado em $EXE"; exit 1; }
          "$EXE" version

      - name: o manifesto foi escrito e nomeia o binario
        shell: pwsh
        run: |
          $m = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'gobsidian/instalacao.json'
          if (-not (Test-Path $m)) {
            # Fora do Windows o manifesto segue os.UserCacheDir.
            $base = if ($env:XDG_CACHE_HOME) { $env:XDG_CACHE_HOME } elseif ($IsMacOS) { "$env:HOME/Library/Caches" } else { "$env:HOME/.cache" }
            $m = Join-Path $base 'gobsidian/instalacao.json'
          }
          if (-not (Test-Path $m)) { Write-Output "[!] manifesto nao encontrado em $m"; exit 1 }
          $doc = Get-Content $m -Raw | ConvertFrom-Json
          if (-not $doc.binario) { Write-Output "[!] manifesto sem o caminho do binario"; exit 1 }
          if (-not $doc.hash)    { Write-Output "[!] manifesto sem o hash"; exit 1 }
          Write-Output "[OK] manifesto: $($doc.binario)"

  bootstraps:
    # Os tres bootstraps sao 126 linhas que ninguem compila. Um erro de sintaxe
    # neles so apareceria na maquina de quem esta instalando pela primeira vez
    # -- a pior hora possivel para descobrir.
    #
    # Isto NAO baixa nada: o que se verifica e que cada script e sintaticamente
    # valido para a shell dele.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: sh
        run: sh -n bootstrap/install.sh
      - name: powershell
        shell: pwsh
        run: |
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bootstrap/install.ps1), [ref]$null, [ref]$erros) | Out-Null
          if ($erros) { $erros | ForEach-Object { Write-Output $_ }; exit 1 }
          Write-Output "[OK] bootstrap/install.ps1"
