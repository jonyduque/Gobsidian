name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A bateria do projeto roda ANTES de publicar qualquer coisa.
  #
  # Ate 2026-09-08 este workflow nao dependia de nada: uma tag publicava
  # binarios mesmo com o `ci` vermelho, e ninguem ficava sabendo. O gate e o
  # MESMO workflow reusavel que o `ci` chama -- uma conta por regra.
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      go-version: '1.26'

  build-and-release:
    name: Build and Release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Get version info
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          # %Y-%m-%dT%H:%M:%SZ, e nao %Y-%M-%DThh:mm:ssZ. No date(1), %M e
          # MINUTO e %D e a data no formato americano mm/dd/yy; hh, mm e ss
          # minusculos nao sao especificadores e saem literais. A forma errada
          # esteve aqui desde o inicio e carimbou "2026-58-08/03/26Thh:mm:ssZ"
          # dentro dos binarios da v0.1.0 e da v1.0.0.
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build static binaries
        env:
          CGO_ENABLED: '0'
          LDFLAGS: "-s -w -X main.version=${{ steps.vars.outputs.version }} -X main.commit=${{ steps.vars.outputs.commit }} -X main.buildDate=${{ steps.vars.outputs.build_date }}"
        run: |
          mkdir -p bin
          # -trimpath tira o caminho do runner dos simbolos: sem ele, o binario
          # publicado carrega /home/runner/work/... embutido.
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/gobsidian-windows-amd64.exe ./cmd/gobsidian
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/gobsidian-darwin-arm64 ./cmd/gobsidian
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/gobsidian-linux-amd64 ./cmd/gobsidian

      # Sem este arquivo o instalador ABORTA, e com razao: um binario sem soma
      # publicada nao pode ser verificado. As releases anteriores nao o traziam.
      # Os nomes sao gravados sem diretorio para que a soma seja conferivel do
      # lado de quem baixa, que nao tem bin/.
      - name: Generate SHA256SUMS.txt
        run: |
          cd bin
          sha256sum gobsidian-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/gobsidian-windows-amd64.exe
            bin/gobsidian-darwin-arm64
            bin/gobsidian-linux-amd64
            bin/SHA256SUMS.txt
          generate_release_notes: true
