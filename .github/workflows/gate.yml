# gate.yml e a bateria do projeto -- scripts/verify.ps1 -- rodando no CI.
#
# Ela existe como workflow REUSAVEL (workflow_call) porque dois lugares
# precisam dela: o `ci` de todo push, e o `release` de toda tag. Escrever as
# etapas duas vezes seria duas contas da mesma regra, e a que fica na copia
# menos usada e a que diverge -- exatamente o que aconteceu ate 2026-09-08,
# quando o `ci.yml` reimplementava um subconjunto de `verify.ps1` e
# `mutate.ps1`, `check_gates.ps1` e `audit_reports.ps1` nao rodavam no CI
# em lugar nenhum.
name: gate

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.26'
      golangci-version:
        required: false
        type: string
        default: 'v2.12.2'

jobs:
  verify:
    # windows-latest, e nao ubuntu: verify.ps1 cobra os tetos de latencia, o
    # gate de encoding e os checks de plataforma que so existem no Windows --
    # e o Windows e a plataforma que o produto serve.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
      # verify.ps1 CHAMA golangci-lint direto, e o runner nao o traz.
      #
      # A primeira versao deste workflow assumiu que o runner tinha as mesmas
      # ferramentas que a maquina de quem desenvolve. Ele nao tem: a tag v1.6.0
      # reprovou com "The term 'golangci-lint' is not recognized", e nenhum
      # binario foi publicado -- a falha segura funcionou, mas a causa era esta.
      #
      # A versao e FIXADA e conferida duas vezes: aqui na instalacao, e dentro
      # do proprio verify.ps1, que recusa rodar contra outra ("golangci-lint
      # fora da versao fixada pelo CI"). Com ela flutuando, um lint verde na
      # maquina de quem desenvolve nao diz nada sobre o CI.
      - name: golangci-lint ${{ inputs.golangci-version }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-version }}
          install-mode: binary
          # install-only: a acao INSTALA e poe no PATH, sem rodar o linter.
          # Quem roda e o verify.ps1 no passo seguinte, para os dois GOOS que
          # ele cobre.
          #
          # A primeira tentativa passou `args: --version` achando que isso
          # faria a acao so conferir a instalacao. Nao faz: ela monta
          # `golangci-lint run <args>`, e o comando virou
          # `golangci-lint run --version` -- "unknown flag: --version",
          # exit 3. O log do CI mostrou a linha montada, e a opcao que
          # realmente existe para isto estava ali ao lado.
          install-only: true

      - name: bateria completa (scripts/verify.ps1)
        shell: pwsh
        run: ./scripts/verify.ps1
