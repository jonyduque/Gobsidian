name: bench

on:
  push:
  pull_request:
  # A referencia e adotada por commit deliberado. workflow_dispatch existe para
  # produzir os numeros de uma maquina nova antes de commita-los: o job imprime
  # o que mediu e o passo de comparacao falha dizendo o comando exato.
  workflow_dispatch:

jobs:
  bench:
    # UM runner so, de proposito. A referencia em docs/bench-baseline.json traz
    # o nome da maquina que a produziu, e comparar numero de ubuntu com numero
    # de windows nao mede regressao — mede a diferenca entre os dois runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Semente fixa. Sem cofre deterministico nao ha contra o que comparar: o
      # corpus mudaria a cada rodada e o delta mediria o corpus, nao o codigo.
      - name: gerar cofre sintetico de 5.000 notas
        shell: pwsh
        run: ./scripts/gen_vault.ps1 -Notes 5000 -Seed 42 -Out "${{ runner.temp }}/vault_bench"

      - name: rodar benchmarks
        env:
          GOBSIDIAN_BENCH_VAULT: ${{ runner.temp }}/vault_bench
        # -run '^$' porque `go test -bench` roda os testes junto por padrao, e
        # os testes deste pacote levam minutos. -benchtime 5x fixa o numero de
        # iteracoes: o padrao e por tempo, e numero de iteracoes variavel entre
        # rodadas e mais uma fonte de ruido num runner compartilhado.
        #
        # -count 5 porque UMA amostra nao decide nada neste runner. Com amostra
        # unica o gate reprovou duas vezes sem mudanca de codigo -- +45,5% em
        # SearchDoisTermos e +39,1% em SearchTermoAmploCache --, e as duas vezes
        # a resposta foi subir o teto, o que trata sintoma. bench_compare.ps1
        # usa a MEDIANA das amostras; antes ele deixava a ultima vencer, entao
        # -count sozinho teria dado falsa sensacao de robustez.
        run: |
          go test -run '^$' -bench . -benchtime 5x -count 5 ./internal/service/ | tee bench.txt
          # tee nao propaga a falha do go test; PIPESTATUS propaga.
          exit ${PIPESTATUS[0]}

      - name: comparar com a referencia commitada
        shell: pwsh
        run: ./scripts/bench_compare.ps1 -BenchOutput bench.txt

      # Sobe a saida bruta mesmo quando o passo acima reprova: sem ela, quem
      # investiga a regressao so tem o percentual.
      - name: guardar a saida bruta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: bench.txt
          if-no-files-found: warn

  # Os tres tetos de latencia so sao cobrados sem `-race`, porque o detector
  # multiplica o tempo -- o teste le `if raceEnabled || p95 <= teto`. E o
  # `ci.yml` roda SO `go test -race ./...`. Ate 2026-09-01 o resultado era que
  # os tetos existiam, o verify.ps1 os cobrava na maquina do dono, e o CI nao
  # cobrava nenhum: "teto que nao e cobrado em lugar nenhum nao e teto".
  #
  # Antes de ligar, mediu-se. O receio era concreto: o proprio verify.ps1
  # registra que TestBM25KernelLatency mediu p95 de 107,1 ms num runner do CI
  # sem regressao nenhuma, e um gate calibrado na maquina errada reprova ao
  # acaso. Medido aqui em tres rodadas, SEM -race:
  #
  #   TestRNF04VaultSearchLatencyP95        pior p95 1,64 ms   teto 100 ms   ~60x
  #   TestRNF04SnippetConcurrencyLimit200   pior p95 1,79 ms   teto  22 ms   ~12x
  #   TestBM25KernelLatency                 pior p95  143 us   teto  80 ms  ~550x
  #
  # Os 107,1 ms eram COM -race, e o comentario do verify.ps1 diz isso. Sem o
  # detector o runner e rapido e consistente, entao os tetos atuais cabem e nao
  # ha o que recalibrar. A folga mais apertada e 12x.
  #
  # Mesmo runner do job acima, e pela mesma razao: comparar numero de ubuntu com
  # numero de windows mede a diferenca entre runners.
  tetos-de-latencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Os tres geram o proprio corpus de 500 notas em processo: nao dependem do
      # cofre sintetico que o job de bench monta.
      #
      # Tres rodadas porque UMA amostra nao decide nada neste runner -- a mesma
      # licao que levou o job de bench a usar `-count 5` e mediana. Reprova se
      # QUALQUER rodada reprovar.
      - name: tetos de latencia, sem -race
        run: |
          falhou=0
          for i in 1 2 3; do
            echo "::group::rodada $i"
            # A saida vai para arquivo e o filtro roda DEPOIS, de proposito.
            # `go test ... | grep ...` devolveria o status do grep, e com um
            # `|| true` no fim o passo nunca reprovaria -- um gate que nao pode
            # reprovar e pior que gate nenhum. Ver docs/ARMADILHAS.md.
            if ! go test -count=1 -v -run 'TestRNF04VaultSearchLatencyP95|TestRNF04SnippetConcurrencyLimit200' ./internal/service/ > servico.txt 2>&1; then
              falhou=1
            fi
            grep -E 'mediana|p95|RNF-04|--- (FAIL|PASS)' servico.txt || true

            if ! go test -count=1 -v -run 'TestBM25KernelLatency' ./internal/search/ > busca.txt 2>&1; then
              falhou=1
            fi
            grep -E 'Mediana|p95|--- (FAIL|PASS)' busca.txt || true
            echo "::endgroup::"
          done
          exit $falhou
